<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oral Health Survey — Data Collection Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#EEF3F4; --card:#FFFFFF; --ink:#13262B; --muted:#5C7378;
    --teal:#0E7C7B; --teal-deep:#0A5C5B; --coral:#E0603A; --mint:#DCEFEA;
    --line:#DCE6E8; --line-soft:#EAF0F1; --fill:#F2FAF8;
    --ur:#0E7C7B; --ul:#2E73A8; --ll:#9A6BB5; --lr:#C77A2E;
    --shadow:0 1px 2px rgba(19,38,43,.04),0 10px 30px -18px rgba(19,38,43,.22);
    --shadow-lift:0 2px 4px rgba(19,38,43,.05),0 18px 44px -20px rgba(19,38,43,.28);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; color:var(--ink);
    background:
      radial-gradient(1100px 520px at 88% -8%, rgba(14,124,123,.07), transparent 60%),
      radial-gradient(900px 460px at -6% 4%, rgba(46,115,168,.06), transparent 55%),
      var(--base);
    background-attachment:fixed;
    font-family:"Inter",system-ui,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px; margin:0 auto; padding:28px 20px 120px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important}
  }

  /* ---------- Header ---------- */
  header.masthead{
    background:linear-gradient(135deg,var(--teal-deep),var(--teal));
    color:#fff; border-radius:20px; padding:32px 34px; box-shadow:var(--shadow-lift);
    position:relative; overflow:hidden;
  }
  header.masthead::before{
    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:26px 26px; -webkit-mask-image:linear-gradient(120deg,#000,transparent 62%);
    mask-image:linear-gradient(120deg,#000,transparent 62%);
  }
  header.masthead::after{
    content:""; position:absolute; right:-60px; top:-70px; width:280px; height:280px;
    background:radial-gradient(circle at center,rgba(255,255,255,.16),transparent 70%);
  }
  header.masthead > *{position:relative; z-index:1}
  .eyebrow{font-family:"Space Grotesk"; letter-spacing:.24em; text-transform:uppercase;
    font-size:11px; font-weight:600; opacity:.9}
  header.masthead h1{
    font-family:"Space Grotesk"; font-weight:600; font-size:31px; line-height:1.08;
    margin:9px 0 6px; letter-spacing:-.015em;
  }
  header.masthead p{margin:0; opacity:.9; font-size:14px; max-width:60ch}
  .meterbar{margin-top:24px; display:flex; align-items:center; gap:14px}
  .meter{flex:1; height:9px; background:rgba(255,255,255,.2); border-radius:99px; overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
  .meter > i{display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#fff,#DCEFEA); border-radius:99px; transition:width .4s cubic-bezier(.4,0,.2,1)}
  .meterpct{font-family:"Space Grotesk"; font-weight:600; font-size:13px; min-width:42px; text-align:right;
    font-variant-numeric:tabular-nums}

  /* ---------- Sections ---------- */
  section.card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:24px 26px; margin-top:20px; box-shadow:var(--shadow);
    transition:box-shadow .25s ease;
  }
  section.card:hover{box-shadow:var(--shadow-lift)}
  .sechead{display:flex; align-items:center; gap:14px; margin:0 0 18px}
  .tab{
    flex:none; width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--teal),var(--teal-deep)); color:#fff; font-family:"Space Grotesk";
    font-weight:700; font-size:17px; box-shadow:0 4px 12px -4px rgba(14,124,123,.5);
  }
  .sechead h2{font-family:"Space Grotesk"; font-weight:600; font-size:18px; margin:0; letter-spacing:-.01em}
  .sechead .sub{display:block; font-family:"Inter"; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:2px}

  /* ---------- Fields ---------- */
  .grid{display:grid; gap:16px 22px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  label.field{display:block}
  .lab{font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:.01em; margin-bottom:6px; display:block}
  .req::after{content:"•"; color:var(--coral); margin-left:5px; font-size:16px; line-height:0}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font:inherit; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:10px; padding:9px 11px; transition:border-color .15s, box-shadow .15s;
  }
  textarea{resize:vertical; min-height:46px}
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,124,123,.14);
  }
  .qblock{padding:14px 0; border-top:1px solid var(--line-soft)}
  .qblock:first-of-type{border-top:none; padding-top:2px}
  .qnum{font-family:"Space Grotesk"; font-weight:600; color:var(--teal); margin-right:7px}
  .qtext{font-weight:600; font-size:14.5px}
  .opts{display:flex; flex-wrap:wrap; gap:8px 10px; margin-top:11px}
  .opt{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    border:1px solid var(--line); border-radius:99px; padding:7px 14px 7px 11px;
    font-size:13.5px; background:#fff; transition:all .14s; user-select:none;
  }
  .opt:hover{border-color:var(--teal); background:var(--fill)}
  .opt input{accent-color:var(--teal); width:15px; height:15px; margin:0}
  .opt:has(input:checked){border-color:var(--teal); background:var(--mint); color:var(--teal-deep); font-weight:500}
  .inline-specify{display:inline-flex; align-items:center; gap:9px; flex-wrap:wrap}
  .inline-specify input[type=text]{width:auto; min-width:240px; flex:1}

  /* ---------- Exam grids ---------- */
  .legend{
    display:flex; flex-wrap:wrap; gap:7px 9px; margin:2px 0 16px; font-size:12px; color:var(--muted);
  }
  .legend b{color:var(--ink); font-family:"Space Grotesk"; font-weight:600}
  .legend span{background:var(--line-soft); border-radius:7px; padding:4px 9px}
  .scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
  table.exam{border-collapse:collapse; width:100%; min-width:560px; font-size:13.5px}
  table.exam th, table.exam td{padding:0; text-align:center; border-bottom:1px solid var(--line-soft)}
  table.exam thead th{
    position:sticky; top:0; background:#fff; z-index:2;
    font-family:"Space Grotesk"; font-weight:600; font-size:12px; color:var(--muted);
    padding:11px 8px; border-bottom:1px solid var(--line);
  }
  .quad-row td{background:var(--line-soft); font-family:"Space Grotesk"; font-weight:600;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    text-align:left; padding:7px 14px}
  .toothcell{
    font-family:"Space Grotesk"; font-weight:600; font-size:14px; padding:0 6px;
    border-right:1px solid var(--line-soft); position:relative;
  }
  .toothcell::before{content:""; position:absolute; left:0; top:18%; bottom:18%; width:3px; border-radius:3px}
  tr[data-q="UR"] .toothcell::before{background:var(--ur)}
  tr[data-q="UL"] .toothcell::before{background:var(--ul)}
  tr[data-q="LL"] .toothcell::before{background:var(--ll)}
  tr[data-q="LR"] .toothcell::before{background:var(--lr)}
  table.exam td.cell{padding:5px 6px}
  table.exam select.score{
    border:1px solid transparent; background:transparent; border-radius:7px;
    padding:6px 4px; text-align:center; text-align-last:center; font-size:13px; min-width:62px;
  }
  table.exam select.score:hover{border-color:var(--line)}
  table.exam td.filled select.score{background:var(--mint); font-weight:600; color:var(--teal-deep)}
  table.exam tbody tr:hover td:not(.toothcell){background:var(--fill)}
  table.exam tfoot td{
    border-top:1px solid var(--line); font-size:13px; padding:9px 6px;
    font-family:"Space Grotesk"; font-weight:600;
  }
  table.exam tfoot tr.tally-row td{background:#fff}
  table.exam tfoot td.tlabel{
    text-align:left; padding-left:14px; color:var(--muted); font-weight:600;
    text-transform:uppercase; letter-spacing:.1em; font-size:11px;
  }
  table.exam tfoot tr.total td{color:var(--teal-deep); background:var(--fill)}
  table.exam tfoot tr.total td.tlabel{color:var(--teal-deep)}
  .tally-strip{
    display:flex; flex-wrap:wrap; gap:8px 10px; margin-top:14px; font-size:12.5px;
  }
  .tally-strip .chip{
    background:var(--fill); border:1px solid var(--line); border-radius:9px; padding:7px 12px;
    display:inline-flex; align-items:baseline; gap:8px;
  }
  .tally-strip .chip b{font-family:"Space Grotesk"; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; font-size:10.5px}
  .tally-strip .chip span{font-family:"Space Grotesk"; font-weight:600; color:var(--ink)}
  .tally-strip .chip span i{color:var(--muted); font-style:normal; font-weight:500}
  .tally-strip .chip.tot{background:var(--mint); border-color:var(--teal)}
  .tally-strip .chip.tot span{color:var(--teal-deep)}

  /* ---------- Index timers ---------- */
  .timer-head{font-size:12.5px; color:var(--muted); margin:2px 0 10px; display:flex; align-items:center; gap:8px}
  .timer-head svg{flex:none}
  .timer-panel{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:0 0 18px}
  .timer{border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--fill); transition:all .15s}
  .timer .tname{font-family:"Space Grotesk"; font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
  .timer .ttime{font-family:"Space Grotesk"; font-weight:600; font-size:21px; color:var(--ink); margin:5px 0 9px; font-variant-numeric:tabular-nums; letter-spacing:.02em}
  .timer.running{border-color:var(--teal); background:var(--mint); box-shadow:0 0 0 3px rgba(14,124,123,.12)}
  .timer.running .ttime{color:var(--teal-deep)}
  .timer .tctrl{display:flex; gap:6px}
  .timer button{font:inherit; font-size:12px; font-weight:600; border-radius:8px; padding:6px 8px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); flex:1; transition:all .14s}
  .timer button.run{background:var(--teal); border-color:var(--teal); color:#fff}
  .timer button.run:hover{background:var(--teal-deep)}
  .timer.running button.run{background:var(--coral); border-color:var(--coral)}
  .timer button.rst{color:var(--muted)}
  .timer button.rst:hover{border-color:var(--coral); color:var(--coral)}
  @media (max-width:680px){ .timer-panel{grid-template-columns:repeat(2,1fr)} }
  @media print{ .timer .tctrl{display:none} .timer{background:#fff; border:1px solid #999} }

  /* ---------- Per-index blocks ---------- */
  .blocks-note{font-size:12.5px; color:var(--muted); margin:0 0 16px; line-height:1.5}
  .index-blocks{display:flex; flex-direction:column; gap:14px}
  .iblock{border:1px solid var(--line); border-radius:14px; padding:0 16px 16px; background:#fff; overflow:hidden}
  /* ---- Per-index color coding ---- */
  .iblock[data-idx]{border-left-width:5px}
  .iblock[data-idx="dmf"]  {border-left-color:#0E7C7B}
  .iblock[data-idx="icdas"]{border-left-color:#3B5BDB}
  .iblock[data-idx="cast"] {border-left-color:#C77700}
  .iblock[data-idx="pufa"] {border-left-color:#9B2C6F}
  .iblock[data-idx="icsc"] {border-left-color:#2E7D32}
  .iblock[data-idx] .iblock-title::before{content:""; display:inline-block; width:11px; height:11px;
    border-radius:3px; margin-right:9px; vertical-align:baseline}
  .iblock[data-idx="dmf"]   .iblock-title::before{background:#0E7C7B}
  .iblock[data-idx="icdas"] .iblock-title::before{background:#3B5BDB}
  .iblock[data-idx="cast"]  .iblock-title::before{background:#C77700}
  .iblock[data-idx="pufa"]  .iblock-title::before{background:#9B2C6F}
  .iblock[data-idx="icsc"]  .iblock-title::before{background:#2E7D32}
  .iblock[data-idx="dmf"]   .iblock-title{color:#0A5C5B}
  .iblock[data-idx="icdas"] .iblock-title{color:#2B44AB}
  .iblock[data-idx="cast"]  .iblock-title{color:#9A5D00}
  .iblock[data-idx="pufa"]  .iblock-title{color:#7A2257}
  .iblock[data-idx="icsc"]  .iblock-title{color:#1F5D22}
  /* filled-tooth tint matches the index color */
  .iblock[data-idx="dmf"]   .trow.filled select.score{background:#DCEFEA; border-color:#0E7C7B; color:#0A5C5B}
  .iblock[data-idx="icdas"] .trow.filled select.score{background:#E4E8FB; border-color:#3B5BDB; color:#2B44AB}
  .iblock[data-idx="cast"]  .trow.filled select.score{background:#FBEFD9; border-color:#C77700; color:#9A5D00}
  .iblock[data-idx="pufa"]  .trow.filled select.score{background:#F7E3EF; border-color:#9B2C6F; color:#7A2257}
  .iblock[data-idx="icsc"]  .trow.filled select.score{background:#E1F0E2; border-color:#2E7D32; color:#1F5D22}
  /* completed counter pill tint matches the index color */
  .iblock[data-idx="dmf"]   .iblock-count.done{background:#DCEFEA; color:#0A5C5B}
  .iblock[data-idx="icdas"] .iblock-count.done{background:#E4E8FB; color:#2B44AB}
  .iblock[data-idx="cast"]  .iblock-count.done{background:#FBEFD9; color:#9A5D00}
  .iblock[data-idx="pufa"]  .iblock-count.done{background:#F7E3EF; color:#7A2257}
  .iblock[data-idx="icsc"]  .iblock-count.done{background:#E1F0E2; color:#1F5D22}
  .iblock-head{display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; margin:0 -16px 14px; padding:12px 16px 11px; border-bottom:1px solid var(--line-soft)}
  /* per-index tinted header band */
  .iblock[data-idx="dmf"]   .iblock-head{background:#E4F2F0; border-bottom-color:#BFE0DB}
  .iblock[data-idx="icdas"] .iblock-head{background:#E9EDFC; border-bottom-color:#CBD4F6}
  .iblock[data-idx="cast"]  .iblock-head{background:#FBF0DD; border-bottom-color:#F0DBB0}
  .iblock[data-idx="pufa"]  .iblock-head{background:#F7E6F0; border-bottom-color:#EDC9E0}
  .iblock[data-idx="icsc"]  .iblock-head{background:#E6F3E7; border-bottom-color:#C6E3C8}
  .iblock-title{font-family:"Space Grotesk"; font-weight:700; font-size:16px; color:var(--ink); letter-spacing:.01em}
  .iblock-tools{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .iblock-count{font-family:"Space Grotesk"; font-weight:600; font-size:12px; padding:5px 11px;
    border-radius:99px; background:#FCE7E0; color:var(--coral); white-space:nowrap}
  .iblock-count.done{background:var(--mint); color:var(--teal-deep)}
  /* Timer status badge (Not started / Recording / Completed) */
  .timer-badge{font-family:"Space Grotesk"; font-weight:600; font-size:11.5px; padding:5px 10px;
    border-radius:99px; white-space:nowrap; letter-spacing:.01em; display:inline-flex; align-items:center; gap:6px}
  .timer-badge::before{content:""; width:8px; height:8px; border-radius:99px; background:currentColor; flex:none}
  .timer-badge.idle{background:#EEF2F3; color:#829699}
  .timer-badge.recording{background:#FDECE6; color:#C6441E; animation:badgePulse 1.4s ease-in-out infinite}
  .timer-badge.done{background:#DCEFEA; color:#0A5C5B}
  @keyframes badgePulse{0%,100%{opacity:1}50%{opacity:.55}}
  .iblock-sub{font-family:"Inter"; font-weight:400; font-size:11.5px; color:var(--muted); margin-left:8px}
  .tooth-quads{display:grid; grid-template-columns:1fr 1fr; gap:16px 18px}
  .iblock-notes{margin-top:16px; padding:0 2px}
  .notes-label{display:flex; align-items:center; gap:8px; font-family:"Space Grotesk"; font-weight:600;
    font-size:13px; color:var(--muted); margin-bottom:6px}
  .opt-tag{font-family:"Inter"; font-weight:500; font-size:11px; color:#8AA0A3; background:var(--fill);
    border-radius:99px; padding:2px 8px; letter-spacing:.02em}
  .notes-field{width:100%; box-sizing:border-box; border:1.5px solid var(--line); border-radius:12px;
    padding:10px 12px; font:inherit; font-size:14px; color:var(--ink); background:#fff; resize:vertical;
    min-height:42px; transition:border-color .15s, box-shadow .15s}
  .notes-field::placeholder{color:#A9BABC}
  .notes-field:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(23,163,152,.12)}
  .tquad{background:var(--fill); border:1px solid var(--line-soft); border-radius:12px;
    padding:12px 14px 10px; border-top:3px solid var(--line)}
  .tquad[data-q="UR"]{border-top-color:var(--ur)}
  .tquad[data-q="UL"]{border-top-color:var(--ul)}
  .tquad[data-q="LL"]{border-top-color:var(--ll)}
  .tquad[data-q="LR"]{border-top-color:var(--lr)}
  .tqlabel{font-family:"Space Grotesk"; font-weight:600; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.1em; color:var(--muted); display:flex; align-items:center; gap:7px; margin-bottom:9px}
  .tqlabel::before{content:""; width:9px; height:9px; border-radius:3px; flex:none}
  .tquad[data-q="UR"] .tqlabel::before{background:var(--ur)}
  .tquad[data-q="UL"] .tqlabel::before{background:var(--ul)}
  .tquad[data-q="LL"] .tqlabel::before{background:var(--ll)}
  .tquad[data-q="LR"] .tqlabel::before{background:var(--lr)}
  .tchips{display:flex; flex-wrap:wrap; gap:8px}
  .trow{display:flex; align-items:center; gap:9px; padding:2px 0}
  .trow .tnum{font-family:"Space Grotesk"; font-weight:600; font-size:12.5px; color:var(--muted);
    width:36px; flex:none; text-align:right}
  .trow select.score{flex:1; min-width:0; max-width:210px; border:1px solid var(--line); border-radius:8px; padding:5px 9px;
    background:#fff; font-size:13px; transition:border-color .15s}
  .trow select.score:hover{border-color:var(--teal)}
  .trow select.score:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,124,123,.14)}
  .trow.filled select.score{background:var(--mint); border-color:var(--teal); font-weight:600; color:var(--teal-deep)}
  /* ICSC 1b/1a sub-readings (shown only when score = 1) */
  .icsc-trow{flex-wrap:wrap}
  .icsc-sub{flex-basis:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:7px 0 3px 34px;
    padding:9px 11px; background:var(--fill); border:1px dashed var(--teal); border-radius:9px}
  .icsc-subfield{display:flex; flex-direction:column; gap:4px}
  .icsc-subfield span{font-size:11px; font-weight:600; color:var(--teal-deep); letter-spacing:.01em}
  .icsc-subfield select.score.sub{width:100%; border:1px solid var(--line); border-radius:8px; padding:6px 8px;
    font-size:12.5px; background:#fff}
  .icsc-subfield select.score.sub:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,124,123,.14)}
  .icsc-subfield select.score.sub.missing{border-color:var(--coral); box-shadow:0 0 0 3px rgba(224,96,58,.15)}
  /* inline timer inside block header */
  .timer.inline{display:flex; align-items:center; gap:7px; padding:5px 6px 5px 13px; margin:0;
    background:var(--fill); border:1px solid var(--line); border-radius:11px; transition:all .15s}
  .timer.inline .ttime{font-family:"Space Grotesk"; font-weight:600; font-size:18px; font-variant-numeric:tabular-nums;
    color:var(--ink); margin:0; min-width:56px; text-align:center; letter-spacing:.02em}
  .timer.inline button{font:inherit; font-size:11.5px; font-weight:600; border-radius:7px; padding:5px 11px;
    cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); flex:none; transition:all .14s}
  .timer.inline button.run{background:var(--teal); border-color:var(--teal); color:#fff}
  .timer.inline button.run:hover{background:var(--teal-deep)}
  .timer.inline button.rst{color:var(--muted)}
  .timer.inline button.rst:hover{border-color:var(--coral); color:var(--coral)}
  .timer.inline.running{border-color:var(--teal); background:var(--mint); box-shadow:0 0 0 3px rgba(14,124,123,.12)}
  .timer.inline.running .ttime{color:var(--teal-deep)}
  .timer.inline.running button.run{background:var(--coral); border-color:var(--coral)}
  @media (max-width:680px){ .tooth-quads{grid-template-columns:1fr} }
  @media print{ .timer.inline button{display:none} .iblock{page-break-inside:avoid} }

  /* ---------- Action bar ---------- */
  .actionbar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(255,255,255,.86); backdrop-filter:blur(10px);

  .missing-panel{position:fixed; right:18px; bottom:84px; z-index:60; width:min(340px,calc(100vw - 36px));

  .success-overlay{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;

  .success-card{background:#fff; border-radius:20px; width:min(430px,100%); padding:30px 28px 24px;
    box-shadow:0 30px 70px -20px rgba(19,38,43,.55); text-align:center; animation:scIn .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes scIn{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
  .sc-check{width:62px; height:62px; margin:0 auto 14px; border-radius:99px; display:grid; place-items:center;

  .sc-check.warn{background:linear-gradient(140deg,#E0603A,#B8431F); box-shadow:0 10px 26px -8px rgba(224,96,58,.55)}
  @keyframes pop{0%{transform:scale(.4); opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1); opacity:1}}
  .sc-title{font-family:"Space Grotesk"; font-weight:700; font-size:21px; margin:0 0 4px; color:var(--ink)}
  .sc-id{margin:0 0 14px; font-size:14px; color:var(--muted)}

  .sc-meta{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; text-align:left; margin:0 0 20px;

  .sc-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  @media print{ .success-overlay{display:none !important} }
  /* ---- Timer reminder bar ---- */
  .timer-prompt{position:fixed; left:50%; transform:translateX(-50%) translateY(20px);
    bottom:78px; z-index:120; display:none; align-items:center; gap:12px;
    background:#13343A; color:#fff; padding:11px 14px 11px 16px; border-radius:14px;

  .timer-prompt.show{display:flex; animation:tpIn .22s cubic-bezier(.2,.8,.2,1) forwards}

  .dent-banner{display:inline-flex; align-items:center; gap:8px; background:var(--mint); color:var(--teal-deep);

  .erupt-chip:hover{border-color:var(--coral); color:var(--coral)}
  .erupt-chip.on{background:var(--coral); border-color:var(--coral); color:#fff}
  .trow.not-erupted{opacity:.45}
  .trow.not-erupted select.score{background:var(--line-soft); border-style:dashed}

  /* ---------- Print ---------- */
  @media print{
    body{background:#fff}
    .actionbar,.toast,.meterbar{display:none}
    header.masthead{background:#fff; color:#000; box-shadow:none; border:1px solid #000; border-radius:0}
    header.masthead::after{display:none}
    header.masthead::before{display:none}
    .iblock-head{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    .tquad{background:#fff; border:1px solid #999}
    .eyebrow,.sechead .sub{color:#333}
    section.card{box-shadow:none; border:1px solid #999; border-radius:0; page-break-inside:avoid; margin-top:12px}
    .scroll{overflow:visible}
    .opt{border:1px solid #999}
    .wrap{padding:0; max-width:100%}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div class="wrap"></div>
<script>
function ensureNotesBlocks(){}
function ensureAllNotesBlocks(){
  ensureNotesBlocks("permBlocks", "perm");
  ensureNotesBlocks("primBlocks", "prim");
}
function installNotesObserver(){
  const targets = ["permBlocks","primBlocks"]
    .map(id => document.getElementById(id))
    .filter(Boolean);
  const mo = new MutationObserver(() => ensureAllNotesBlocks());
  targets.forEach(t => mo.observe(t, { childList: true, subtree: true }));
}
document.addEventListener("DOMContentLoaded", () => {
  ensureAllNotesBlocks();
  installNotesObserver();
});
</script>
